name: Selenium TestNG CI Pipeline

on:
  push:
    branches: ["mypractice", "main", "master"]
  pull_request:
    branches: ["mypractice", "main", "master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Selenium Tests (Headless)
        working-directory: Section_12/mypractice/demo
        run: mvn clean test -Dbrowser=chrome-headless

      # 👇 1. BƯỚC MỚI THÊM: Tạo Allure HTML Report từ kết quả test 👇
      - name: Generate Allure Report
        if: always()
        working-directory: Section_12/mypractice/demo
        run: |
          mvn allure:report || true

      # 👇 2. BƯỚC MỚI THÊM: Upload thư mục Allure Report lên Artifacts 👇
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: Section_12/mypractice/demo/target/site/allure-maven-plugin/

      # (Các bước cũ bên dưới giữ nguyên)
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: |
            **/target/surefire-reports/
            **/logs/

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: "**/screenshots/*.png"
